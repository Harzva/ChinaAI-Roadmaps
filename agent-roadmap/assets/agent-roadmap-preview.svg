<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Agent Roadmap GitHub Pages Preview</title>
  <desc id="desc">A screenshot-style preview of the Agent Roadmap static page with hero, stats, insights, filters, cards and detail panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#081426"/><stop offset="1" stop-color="#03040d"/></linearGradient>
    <linearGradient id="g1" x1="0" x2="1"><stop stop-color="#68e9ff"/><stop offset="1" stop-color="#ff6bd3"/></linearGradient>
    <style>
      text{font-family:Inter,Arial,'Noto Sans SC',sans-serif;fill:#f8fbff}.muted{fill:#aab4ce}.tiny{font-size:18px}.label{font-size:22px;font-weight:800}.title{font-size:78px;font-weight:900;letter-spacing:-4px}.card{fill:rgba(255,255,255,.065);stroke:rgba(211,231,255,.18);stroke-width:1.5}.pill{fill:rgba(255,255,255,.08);stroke:rgba(211,231,255,.18);stroke-width:1}.cyan{stroke:#68e9ff}.pink{stroke:#ff6bd3}.gold{stroke:#ffd166}
    </style>
  </defs>
  <rect width="1600" height="960" rx="34" fill="url(#bg)"/>
  <circle cx="250" cy="150" r="260" fill="#68e9ff" opacity=".14"/>
  <circle cx="1280" cy="150" r="300" fill="#ff6bd3" opacity=".12"/>
  <rect x="70" y="48" width="1460" height="64" rx="32" class="card"/>
  <text x="110" y="88" class="label">ChinaAI Roadmaps</text>
  <text x="1175" y="88" class="tiny muted">World Map · Dev Docs · MiWork · Paper</text>

  <rect x="70" y="150" width="950" height="300" rx="28" class="card"/>
  <text x="112" y="205" class="tiny" fill="#9af9ff">AGENT ROADMAP V2 · AI CODING AGENTS · TOKEN ECONOMY</text>
  <text x="112" y="292" class="title">全球 Agent 编程</text>
  <text x="112" y="370" class="title">与 Token 经济生态地图</text>
  <text x="115" y="420" class="tiny muted">A research atlas for TUI agents, IDE agents, work agents and token-efficient infrastructure.</text>
  <rect x="1080" y="150" width="450" height="300" rx="28" class="card"/>
  <text x="1120" y="205" class="tiny muted">RESEARCH SCOPE</text>
  <rect x="1120" y="238" width="330" height="12" rx="6" fill="rgba(255,255,255,.09)"/><rect x="1120" y="238" width="250" height="12" rx="6" fill="url(#g1)"/>
  <rect x="1120" y="284" width="330" height="12" rx="6" fill="rgba(255,255,255,.09)"/><rect x="1120" y="284" width="210" height="12" rx="6" fill="url(#g1)"/>
  <rect x="1120" y="330" width="330" height="12" rx="6" fill="rgba(255,255,255,.09)"/><rect x="1120" y="330" width="285" height="12" rx="6" fill="url(#g1)"/>
  <rect x="1120" y="376" width="330" height="12" rx="6" fill="rgba(255,255,255,.09)"/><rect x="1120" y="376" width="175" height="12" rx="6" fill="url(#g1)"/>

  <g transform="translate(70 480)">
    <rect width="226" height="96" rx="22" class="card"/><text x="28" y="44" class="label">40+</text><text x="28" y="72" class="tiny muted">Projects</text>
    <rect x="246" width="226" height="96" rx="22" class="card"/><text x="274" y="44" class="label">9</text><text x="274" y="72" class="tiny muted">Categories</text>
    <rect x="492" width="226" height="96" rx="22" class="card"/><text x="520" y="44" class="label">High</text><text x="520" y="72" class="tiny muted">MiWork filter</text>
    <rect x="738" width="226" height="96" rx="22" class="card"/><text x="766" y="44" class="label">JSON</text><text x="766" y="72" class="tiny muted">CSV export</text>
    <rect x="984" width="226" height="96" rx="22" class="card"/><text x="1012" y="44" class="label">Paper</text><text x="1012" y="72" class="tiny muted">LaTeX draft</text>
    <rect x="1230" width="230" height="96" rx="22" class="card"/><text x="1258" y="44" class="label">Token</text><text x="1258" y="72" class="tiny muted">Economy radar</text>
  </g>

  <rect x="70" y="610" width="1460" height="78" rx="24" class="card"/>
  <text x="112" y="660" class="tiny muted">Search · Category · Interface · Maturity · Model · MiWork · Token Focus · Card View · Matrix View · Export JSON · Export CSV</text>

  <g transform="translate(70 720)">
    <rect width="340" height="170" rx="26" class="card cyan"/><circle cx="42" cy="42" r="12" fill="#68e9ff"/><text x="62" y="50" class="label">Claude Code</text><text x="36" y="92" class="tiny muted">TUI Agent · Claude · Skills</text><text x="36" y="126" class="tiny muted">Context routing + subagents</text>
    <rect x="370" width="340" height="170" rx="26" class="card pink"/><circle cx="412" cy="42" r="12" fill="#ff6bd3"/><text x="432" y="50" class="label">Qoder Work</text><text x="406" y="92" class="tiny muted">Work Agent · Desktop</text><text x="406" y="126" class="tiny muted">Plan → execute → review</text>
    <rect x="740" width="340" height="170" rx="26" class="card gold"/><circle cx="782" cy="42" r="12" fill="#ffd166"/><text x="802" y="50" class="label">rtk</text><text x="776" y="92" class="tiny muted">Token Optimization · CLI</text><text x="776" y="126" class="tiny muted">Command output filtering</text>
    <rect x="1110" width="350" height="170" rx="26" class="card"/><text x="1148" y="48" class="tiny" fill="#9af9ff">SELECTED</text><text x="1148" y="86" class="label">MiWork Concept</text><text x="1148" y="124" class="tiny muted">Mimo Runtime + Token Compression</text>
  </g>
</svg>
