name: Benchmark source audit

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-source-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Probe public adapters and canonical links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: benchmark-roadmap
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: benchmark-roadmap/package-lock.json
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Probe adapters without publishing
        run: |
          set -o pipefail
          node scripts/fetch-sources.mjs 2>&1 | tee source-audit.txt
      - name: Check canonical links
        if: always()
        run: |
          set -o pipefail
          node scripts/check-links.mjs --online 2>&1 | tee -a source-audit.txt
      - name: Upload source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-source-audit-${{ github.run_id }}
          path: benchmark-roadmap/source-audit.txt
          retention-days: 30
