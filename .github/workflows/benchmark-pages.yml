name: Benchmark Pages release

on:
  push:
    branches: [main]
    paths:
      - "benchmark-roadmap/**"
      - "roadmap-core/**"
      - "index.html"
      - "assets/**"
      - ".github/workflows/benchmark-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Gate and package static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: benchmark-roadmap
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: benchmark-roadmap/package-lock.json
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Run release gates
        run: npm run gates
      - name: Verify generated public data is committed
        run: git diff --exit-code -- data/public
      - name: Stage tracked static site
        working-directory: .
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    name: Deploy and expose URL
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
  smoke:
    name: Smoke deployed leaderboard
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5
    steps:
      - name: Wait for Pages and verify public snapshot
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          curl --fail --retry 6 --retry-delay 10 --max-time 20 "${PAGE_URL}benchmark-roadmap/"
          curl --fail --retry 6 --retry-delay 10 --max-time 20 "${PAGE_URL}benchmark-roadmap/data/public/snapshot.json"
